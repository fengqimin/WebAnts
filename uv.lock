]
playwright = [
    { name = "playwright" },
]

[package.dev-dependencies]
dev = [
    { name = "ipython" },
    { name = "isort" },
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "pytest-cov" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "charset-normalizer", specifier = ">=3.4.1" },
    { name = "cssselect", specifier = ">=1.3.0" },
    { name = "httpx", specifier = ">=0.28.1" },
    { name = "lxml", specifier = ">=5.3.0" },
    { name = "multidict", specifier = ">=6.1.0" },
    { name = "playwright", marker = "extra == 'playwright'", specifier = ">=1.51.0" },
    { name = "psutil", marker = "extra == 'monitoring'", specifier = ">=5.9" },
    { name = "pydantic", specifier = ">=2.11.3" },
    { name = "pyyaml", specifier = ">=6.0.2" },
    { name = "setuptools", specifier = ">=75.6.0" },
    { name = "ujson", specifier = ">=5.10.0" },
]
provides-extras = ["playwright", "monitoring"]

[package.metadata.requires-dev]
dev = [
    { name = "ipython", specifier = ">=9.1.0" },
    { name = "isort", specifier = ">=6.0.1" },
    { name = "pytest", specifier = ">=8.3.5" },
    { name = "pytest-asyncio", specifier = ">=0.26.0" },
    { name = "pytest-cov", specifier = ">=6.1.1" },
    { name = "ruff", specifier = ">=0.9.0" },
]
